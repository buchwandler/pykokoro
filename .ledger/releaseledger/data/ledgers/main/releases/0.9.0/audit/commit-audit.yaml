    observed_behavior:
      The integrated pipeline now requires an explicit document language, builds
      validated language runs from SSMD spans, performs shared source and prepared-text
      linguistic analysis, passes provider-neutral annotations into Spokenform and G2P,
      and segments prepared runs with preserved offsets. Generic written-to-spoken and
      say-as realization is delegated to Spokenform; the obsolete automatic
      mixed-language and local say-as implementations are removed. Documentation,
      examples, tests, and v0.9 dependency declarations are updated for this
      orchestration contract.
    public_impact: public
    decision: accepted
    stale: false
    evidence_subject: "feat: prepare 0.9.0 release, move normalization out of kokorog2p"
    target_entry_id: entry-0002
    notes: Reviewed the complete commit diff and affected tests.
