  - kind: added
    summary:
      Added opt-in token-safe splitting for oversized requests with one rendered result
    body: >-
      The default long_text_split="none" path does not import PhraseSplit and raises
      SynthesisInputTooLongError when the model limit is exceeded. With
      long_text_split="sentence", PhraseSplit loads lazily only for oversized input,
      packs sentence spans into token-safe chunks, then falls back to clauses and safe
      word boundaries. Pronunciation overrides and linguistic annotations are rebased,
      trace metadata reports actual chunking, and the chunks are joined into one
      RenderedSegment. SpaCy is optional; a single word that cannot fit safely still
      raises SynthesisInputTooLongError.
    status: accepted
    source_refs:
      - "git:7a9ce60fd9d44a84bc9f58dfb86ed5db7f00a231"
    paths:
      - pykokoro/request_renderer.py
      - pykokoro/synthesis_config.py
      - tests/test_long_text_splitting.py
    sources:
      - "tl:task-0112"
    prs: []
    issues: []
    contributors: []
  - kind: changed
    summary: Changed model and ONNX session management to use OnnxVoice
    body: >-
      OnnxVoice owns managed model installation, resolution, local opening, provider
      normalization, and session lifecycle. KokoroG2P owns prepared-text phonemization
      and AudioSig supplies DSP primitives. PyKokoro retains request rendering, model
      and voice profile selection, and request-local timing metadata. Metadata-only
      discover_models() and discover_lexicons() inspection remains available without
      loading an inference session.
    status: accepted
    source_refs:
