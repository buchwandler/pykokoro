entries:
  - kind: changed
    summary: Changed PyKokoro to render prepared requests as independent results
    body: >-
      Removed KokoroPipeline, PipelineConfig, UtterPlan planning, AudioCompose
      composition, and SSMD parsing from PyKokoro. Callers now provide prepared text,
      explicit language, voice, and optional source-aligned context; they own document
      orchestration and cross-request composition.
    status: accepted
    breaking: true
    source_refs:
