name: PolyNorm benchmark
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  polynorm:
    runs-on: ubuntu-latest
    env:
      PYKOKORO_POLYNORM_ACCEPT_LICENSE: ${{ vars.PYKOKORO_POLYNORM_ACCEPT_LICENSE || '' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install espeak-ng
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Install packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[cpu,dev]"
        python -m pip install -r requirements-test.txt
    - name: Run PolyNorm benchmark
      if: env.PYKOKORO_POLYNORM_ACCEPT_LICENSE == '1'
      run: |
        python -m benchmarks.polynorm_phoneme \
          --accept-license \
          --pipeline both \
          --baseline benchmarks/baselines/polynorm_phoneme.json \
          --results-dir .benchmarks/polynorm-ci
    - name: Skip benchmark without licence acceptance
      if: env.PYKOKORO_POLYNORM_ACCEPT_LICENSE != '1'
      run: echo "Skipping PolyNorm benchmark because the repository variable is not set."
    - name: Upload benchmark summary
      if: env.PYKOKORO_POLYNORM_ACCEPT_LICENSE == '1'
      uses: actions/upload-artifact@v4
      with:
        name: polynorm-summary
        path: .benchmarks/polynorm-ci/
