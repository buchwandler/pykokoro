name: Run tests
on:
  push:
  workflow_call:
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install espeak-ng (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Install espeak-ng (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install espeak-ng
    - name: Install espeak-ng (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $maxAttempts = 3
        $exitCode = 1
        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          Write-Host "Installing espeak-ng (attempt $attempt/$maxAttempts)..."
          choco install espeak-ng --yes --no-progress
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            break
          }
          if ($attempt -lt $maxAttempts) {
            Start-Sleep -Seconds (5 * $attempt)
          }
        }
        if ($exitCode -ne 0) {
          throw "Chocolatey failed to install espeak-ng after $maxAttempts attempts (exit code $exitCode)."
        }
    - name: Install packages
      run: |
        pip install pytest ruff mypy
        pip install -e ".[cpu,dev]"
        pip install -r requirements-test.txt
        pip install spacy
        python -m spacy download en_core_web_sm
        python -m compileall -q pykokoro tests
    - name: Tests
      run: pytest -m "not slow"

  lower-bounds:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install espeak-ng
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Install lower-bound dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install \
          "kokorog2p[espeak,en]==0.8.0" \
          "phrasplit==0.3.4" \
          "ssmd==0.8.1" \
          "audiosig==0.1.1" \
          "babel==2.12.0" \
          platformdirs
        python -m pip install -e . --no-deps
    - name: Lower-bound contract tests
      run: |
        python -m pytest tests/test_packaging_metadata.py tests/test_import_boundaries.py
