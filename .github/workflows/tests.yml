name: Run tests
on:
  push:
  workflow_call:
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install espeak-ng (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Install espeak-ng (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install espeak-ng
    - name: Install espeak-ng (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $version = "1.52.0"
        $msiPath = Join-Path $env:RUNNER_TEMP "espeak-ng-$version.msi"
        $downloadUrl = "https://github.com/espeak-ng/espeak-ng/releases/download/$version/espeak-ng.msi"
        $expectedHash = "7F673C709EA5DD579D3B5EBB98688CC575328A6AB7438D2BC405B88CEDAEAFB9"

        Invoke-WebRequest -Uri $downloadUrl -OutFile $msiPath
        $actualHash = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash
        if ($actualHash -ne $expectedHash) {
          throw "Unexpected SHA-256 for espeak-ng MSI: $actualHash"
        }

        $installer = Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /quiet /norestart" -Wait -PassThru
        if ($installer.ExitCode -notin @(0, 3010)) {
          throw "espeak-ng MSI installation failed (exit code $($installer.ExitCode))."
        }

        $installPath = @(
          (Join-Path ${env:ProgramFiles} "eSpeak NG"),
          (Join-Path ${env:ProgramFiles(x86)} "eSpeak NG")
        ) | Where-Object { Test-Path (Join-Path $_ "espeak-ng.exe") } | Select-Object -First 1
        if (-not $installPath) {
          throw "espeak-ng was not installed in either Program Files directory"
        }
        $env:Path = "$installPath;$env:Path"
        $installPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Install packages
      run: |
        pip install pytest ruff mypy
        pip install -e ".[cpu,dev]"
        pip install -r requirements-test.txt
        pip install spacy
        python -m spacy download en_core_web_sm
        python -m compileall -q benchmarks pykokoro tests
    - name: Tests
      run: pytest -m "not slow"

  lower-bounds:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install espeak-ng
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Install lower-bound dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install \
          "kokorog2p[espeak,en]==0.8.0" \
          "phrasplit==0.3.4" \
          "ssmd==0.8.1" \
          "audiosig==0.1.1" \
          "babel==2.12.0" \
          platformdirs
        python -m pip install -e . --no-deps
    - name: Lower-bound contract tests
      run: |
        python -m pytest tests/test_packaging_metadata.py tests/test_import_boundaries.py
