name: Run tests
on:
  push:
  workflow_call:
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install espeak-ng (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Install espeak-ng (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install espeak-ng
    - name: Install espeak-ng (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        choco install espeak-ng --version=1.52.0 --yes --no-progress --retry-count=5 --retry-wait=10
        $command = Get-Command espeak-ng -ErrorAction SilentlyContinue
        if ($null -eq $command) {
          $command = Get-Command espeak -ErrorAction SilentlyContinue
        }
        if ($null -eq $command) {
          $roots = @(
            $env:ProgramFiles,
            [Environment]::GetEnvironmentVariable('ProgramFiles(x86)'),
            $env:ChocolateyInstall
          ) | Where-Object { $_ -and (Test-Path $_) }
          $file = Get-ChildItem -Path $roots -Filter 'espeak*.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $file) {
            $command = Get-Command $file.FullName
          }
        }
        if ($null -eq $command) {
          throw 'Chocolatey installed eSpeak NG, but no executable was found.'
        }
        $executablePath = $command.Path
        $installPath = Split-Path -Parent $executablePath
        $dataPath = Join-Path $installPath 'espeak-ng-data'
        $libraryPath = Get-ChildItem -Path $installPath -File -Filter '*espeak*.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -eq $libraryPath -or -not (Test-Path $dataPath)) {
          throw "eSpeak NG installation is missing its library or data directory: $installPath"
        }
        $libraryPath = $libraryPath.FullName
        $env:PATH = "$installPath;$env:PATH"
        $env:KOKOROG2P_ESPEAK_EXECUTABLE = $executablePath
        $env:KOKOROG2P_ESPEAK_LIBRARY = $libraryPath
        $env:KOKOROG2P_ESPEAK_DATA = $dataPath
        @(
          "KOKOROG2P_ESPEAK_EXECUTABLE=$executablePath",
          "KOKOROG2P_ESPEAK_LIBRARY=$libraryPath",
          "KOKOROG2P_ESPEAK_DATA=$dataPath"
        ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $installPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & $executablePath --voices=ar --path=$dataPath | Tee-Object -Variable voices
        if ($LASTEXITCODE -ne 0 -or -not ($voices -match '\bArabic\b')) {
          throw 'The standard eSpeak NG Arabic voice is unavailable'
        }
        & $executablePath -q -x --ipa '-vsem/ar' "--path=$dataPath" 'مَرْحَبًا'
        if ($LASTEXITCODE -ne 0) {
          throw 'The standard eSpeak NG Arabic voice could not phonemize text'
        }
    - name: Install packages
      run: |
        pip install pytest ruff mypy
        pip install -e ".[cpu,dev]"
        pip install -r requirements-test.txt
        pip install spacy
        python -m spacy download en_core_web_sm
        python -m compileall -q benchmarks pykokoro tests
    - name: Type-check public API
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      run: python -m mypy --config-file tests/typecheck/mypy.ini tests/typecheck/public_api.py
    - name: Verify kokorog2p Arabic frontend (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        @'
        from kokorog2p import get_g2p

        g2p = get_g2p(
            language="ar",
            model_profile="nabra-82m-v0.1",
            lexicons=(),
        )
        assert g2p.get_target_model() == "nabra-82m-v0.1"
        assert g2p.phonemize("مَرْحَبًا") == "mˈarħabˌan"
        '@ | python -
    - name: Install Lexphon data
      run: lexphon data install en-us:gold pt-pt:lexhint
    - name: Tests
      run: pytest -m "not slow"

  lower-bounds:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install espeak-ng
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Install lower-bound dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install \
          "kokorog2p[all]==0.9.9" \
          "lexphon==0.2.3" \
          "phrasplit==0.3.9" \
          "audiosig==0.1.4" \
          "onnxvoice[cpu]==0.1.7" \
          platformdirs
        python -m pip install -e .
    - name: Install Lexphon data
      run: lexphon data install pt-pt:lexhint
    - name: Lower-bound contract tests
      run: |
        python -m pytest -q \
          tests/test_packaging_metadata.py \
          tests/test_import_boundaries.py \
          tests/test_frontend_contracts.py \
          tests/test_lexphon_provisioning.py \
          tests/test_onnxvoice_boundary.py \
          tests/test_request_renderer.py \
          tests/test_voice_manager.py \
          tests/test_audio_generator_performance.py


  package-resources:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kokorog2p-version: ["0.9.9"]
    steps:
    - uses: actions/checkout@v4
    - name: Install espeak-ng
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Build candidate wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel --outdir "$RUNNER_TEMP/wheels"
    - name: Install isolated candidate
      run: |
        python -m venv "$RUNNER_TEMP/pykokoro-wheel-venv"
        "$RUNNER_TEMP/pykokoro-wheel-venv/bin/python" -m pip install \
          "kokorog2p[all]==${{ matrix.kokorog2p-version }}" \
          "${RUNNER_TEMP}"/wheels/pykokoro-*.whl
    - name: Verify packaged resources outside checkout
      working-directory: ${{ runner.temp }}
      run: |
        "$RUNNER_TEMP/pykokoro-wheel-venv/bin/python" -c \
          "import kokorog2p; assert kokorog2p.get_kokoro_vocab()"
    - name: Verify frontend phonemization outside checkout
      working-directory: ${{ runner.temp }}
      run: |
        "$RUNNER_TEMP/pykokoro-wheel-venv/bin/python" - <<'PY'
        from pykokoro.tokenizer import Tokenizer, TokenizerConfig

        tokenizer = Tokenizer(
            config=TokenizerConfig(
                backend="kokorog2p",
                lexicons=(),
                fallback="espeak",
                use_spacy=False,
            )
        )
        assert tokenizer._get_g2p("en-us").phonemize("Hello world")
        PY
