name: Run tests
on:
  push:
  workflow_call:
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install espeak-ng (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Install espeak-ng (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install espeak-ng
    - name: Install espeak-ng (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install espeak-ng
    - name: Install packages
      run: |
        pip install pytest ruff mypy
        pip install -e ".[cpu,dev]"
        pip install -r requirements-test.txt
        pip install spacy
        python -m spacy download en_core_web_sm
        python -m compileall -q pykokoro tests
    - name: Tests
      run: pytest -m "not slow"

  lower-bounds:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install espeak-ng
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng
    - name: Install lower-bound dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install \
          "kokorog2p[espeak,en]==0.7.1" \
          "phrasplit==0.3.4" \
          "ssmd==0.8.1"
        python -m pip install -e . --no-deps
    - name: Lower-bound contract tests
      run: |
        python -m pytest tests/test_packaging_metadata.py tests/test_import_boundaries.py
