[codecrate]
output = "context_pykokoro.md"
keep_docstrings = true
dedupe = true
metadata = false
respect_gitignore = true
exclude = ["*/.venv/*"]
gitignore_allow = ["pykokoro/_version.py"]
include = ["**/*.py", "**/*.toml", "**/*.rst", "**/*.md", "LICENSE"]
split_max_chars = 0
layout = "full"
ptofile = "portable-agent"
emit_standalone_unpacker = true
