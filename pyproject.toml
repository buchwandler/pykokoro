[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "pykokoro*",
]

[tool.setuptools.package-data]
pykokoro = ["py.typed", "data/*.json"]

[project]
name = "pykokoro"
description = "A request-centric Kokoro speech-synthesis engine"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Holger Nahrstaedt", email = "nahrstaedt@gmail.com"}
]
keywords = ["tts", "text-to-speech", "kokoro", "phonemizer", "espeak"]
dependencies = [
    "kokorog2p[espeak,en]>=0.9.15,<1.0",
    "lexphon>=0.2.3,<0.3",
    "phrasplit>=0.3.9,<0.4",
    "numpy",
    "audiosig>=0.1.4,<0.2",
    "platformdirs",
    "onnxvoice>=0.1.7,<0.2",
    "soundfile",
    "typing_extensions>=4.0"
]
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Operating System :: OS Independent',
    'Typing :: Typed',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Multimedia :: Sound/Audio :: Speech',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Text Processing :: Linguistic',
]

dynamic=["version"]

[project.urls]
Homepage = "https://github.com/buchwandler/pykokoro"
Repository = "https://github.com/buchwandler/pykokoro"
Issues = "https://github.com/buchwandler/pykokoro/issues"
Changelog = "https://github.com/buchwandler/pykokoro/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
cpu = ["onnxvoice[cpu]>=0.1.7,<0.2"]
gpu = ["onnxvoice[gpu]>=0.1.7,<0.2"]
openvino = ["onnxvoice[openvino]>=0.1.7,<0.2"]
directml = ["onnxvoice[directml]>=0.1.7,<0.2"]
coreml = ["onnxvoice[coreml]>=0.1.7,<0.2"]
goruut = [
    "kokorog2p[goruut]>=0.9.8,<1.0",
]
sounddevice = ["sounddevice"]
playback = ["sounddevice"]
all = [
    "sounddevice",
]
huggingface = ["huggingface-hub>=0.27"]

[tool.setuptools_scm]
write_to = "pykokoro/_version.py"
fallback_version = "0.10.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "polynorm: requires the externally licensed PolyNorm benchmark corpus",
    "external_data: requires explicitly provisioned external benchmark data",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false  # Disabled: too many errors from third-party libs without type stubs
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed: allow some untyped defs for practicality
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # Relaxed
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false  # Disabled: too many errors from third-party libs
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["pykokoro"]
branch = true
omit = ["pykokoro/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
